<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jujitsu Kaisen Database</title>
<style>
body { 
  font-family: Arial, sans-serif; 
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}

/* Header styling */
.header {
  background: linear-gradient(135deg, #1e3c72 0%, #132757 100%);
  color: white;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.header h1 {
  margin: 0;
  font-size: 36px;
  font-weight: bold;
}

.header p {
  margin: 10px 0 0 0;
  font-size: 16px;
  opacity: 0.9;
}

/* Main container */
.container {
  margin: 40px auto;
  width: 80%;
  max-width: 600px;
}

/* Card-style sections with shadow */
.section { 
  background: white;
  padding: 30px;
  margin-bottom: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 16px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}

.section:hover {
  box-shadow: 0 12px 24px rgba(0,0,0,0.15);
  transform: translateY(-2px);
}

.section h2 {
  margin-top: 0;
  color: #132757;
}

input { 
  margin: 10px 0; 
  padding: 12px; 
  width: 100%;
  max-width: 400px;
  height: 45px;
  font-size: 15px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  transition: border-color 0.3s ease;
  box-sizing: border-box;
}

input:focus {
  outline: none;
  border-color: #132757;
}

input[type="file"] {
  padding: 10px;
  height: auto;
}

button { 
  width: 160px;
  height: 45px;
  border-radius: 8px;
  font-size: 15px;
  margin: 10px 5px 0 0;
  cursor: pointer;
  border: none;
  background-color: #132757;
  color: #FFFFFF;
  transition: all 0.3s ease;
  font-weight: 500;
}

button:hover { 
  opacity: 0.85;
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.back-btn { 
  background-color: #808080; 
  color: white; 
}

.delete-btn { 
  background-color: #ff4444; 
  color: white; 
}

.save-btn {
  background-color: #4CAF50;
  color: white;
}

#profile-img {
  width: 300px;
  height: 300px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 20px;
  border: 3px solid #e0e0e0;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* Fade in animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.section {
  animation: fadeIn 0.4s ease;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>📋 Jujitsu Kaisen Academy Profile Manager</h1>
  <p>Create, search, and manage user profiles for all students attending the JJK Academy in Tokyo, Japan.</p>
</div>

<div class="container">
  <!-- Actions -->
  <div id="profile-actions" class="section">
    <h2>What would you like to perform?</h2>
    <button onclick="showAdd()">Add New Profile</button>
    <button onclick="showSearch()">Search Profile</button>
  </div>

  <!-- Add Profile -->
  <div id="add-profile" class="section" style="display:none;">
    <h2>Add New Profile</h2>
    <input type="file" id="add-image" accept="image/jpeg,image/jpg"><br>
    <input id="add-name" placeholder="Name"><br>
    <input id="add-email" placeholder="Email"><br>
    <input id="add-interests" placeholder="Interests"><br>
    <button onclick="handleAddProfile()">Create Profile</button>
    <button class="back-btn" onclick="showHome()">Back</button>
  </div>

  <!-- Search Profile -->
  <div id="search-profile" class="section" style="display:none;">
    <h2>Search Profile</h2>
    <input id="search-userid" placeholder="Enter User ID"><br>
    <button onclick="handleSearch()">Load Profile</button>
    <button class="back-btn" onclick="showHome()">Back</button>
  </div>

  <!-- Edit Profile -->
  <div id="edit-profile" class="section" style="display:none;">
    <h2>Edit Profile</h2>
    <img id="profile-img" src="" alt="Profile Picture"><br>
    <input id="edit-name" placeholder="Name"><br>
    <input id="edit-email" placeholder="Email"><br>
    <input id="edit-interests" placeholder="Interests"><br>
    <button onclick="handleUpdateProfile()" class="save-btn">Save Profile</button>
    <button onclick="handleDeleteProfile()" class="delete-btn">Delete Profile</button>
    <button class="back-btn" onclick="showHome()">Back</button>
  </div>
</div>

<script src="client.js"></script>
</body>
</html>
