<html lang="en">
<style>
body { 
  font-family: Arial, sans-serif; 
  padding: 20px; 
}

.container {
  margin: 40px auto;
  width: 80%;
  max-width: 600px;
}

.section { 
  margin-bottom: 30px; 
}

input { 
  margin: 5px 0; 
  padding: 8px; 
  width: 250px;
  height: 32px;
  font-size: 15px;
  border: 1px solid #ddd;
  border-radius: 4px;
}

button { 
  width: 160px;
  height: 45px;
  border-radius: 6px;
  font-size: 15px;
  margin: 5px 5px 0 0;
  cursor: pointer;
  border: none;
  background-color: #132757;
  color: #FFFFFF;
  transition: 0.3s;
}

button:hover { 
  opacity: 0.85;
  transform: translateY(-2px);
}

.back-btn { 
  background-color: #808080; 
  color: white; 
}

.delete-btn { 
  background-color: #ff4444; 
  color: white; 
}

.save-btn {
  background-color: #4CAF50;
  color: white;
}

#profile-img {
  width: 300px;
  height: 300px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 15px;
  border: 2px solid #ddd;
}
</style>
<script>
(async function init() {
    // 1️⃣ Get userid from localStorage (browser remembers each user)
    let userid = localStorage.getItem('userid');
    let user = null;

    // 2️⃣ If userid doesn't exist, create a new profile
    if (!userid) {
        const res = await fetch('http://localhost:3000/add-profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: '', email: '', interests: '' }) // empty default profile
        });
        const json = await res.json();
        user = json.user;
        userid = user.userid;                 // store generated userid
        localStorage.setItem('userid', userid);
    } else {
        // 3️⃣ Fetch existing profile by userid
        const res = await fetch(`http://localhost:3000/get-profile/${userid}`);
        user = await res.json();
    }

    // 4️⃣ Populate the HTML
    document.getElementById('name').textContent = user.name || 'Gojo Saturo';
    document.getElementById('email').textContent = user.email || 'gojo.saturo@example.com';
    document.getElementById('interests').textContent = user.interests || 'Retail Therapy';

    document.getElementById('input-name').value = user.name || '';
    document.getElementById('input-email').value = user.email || '';
    document.getElementById('input-interests').value = user.interests || '';

    document.getElementById('container').style.display = 'block';
})();

// 5️⃣ Edit button toggle
function updateProfile() {
    document.getElementById('container').style.display = 'none';
    document.getElementById('container-edit').style.display = 'block';

    document.getElementById('input-name').value = document.getElementById('name').textContent;
    document.getElementById('input-email').value = document.getElementById('email').textContent;
    document.getElementById('input-interests').value = document.getElementById('interests').textContent;
}

// 6️⃣ Save updated profile
async function handleUpdateProfileRequest() {
    const userid = localStorage.getItem('userid'); // use dynamic userid
    const payload = {
        userid,
        name: document.getElementById('input-name').value,
        email: document.getElementById('input-email').value,
        interests: document.getElementById('input-interests').value
    };

    const response = await fetch('http://localhost:3000/update-profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const updatedUser = await response.json();

    document.getElementById('name').textContent = updatedUser.user.name;
    document.getElementById('email').textContent = updatedUser.user.email;
    document.getElementById('interests').textContent = updatedUser.user.interests;

    document.getElementById('container-edit').style.display = 'none';
    document.getElementById('container').style.display = 'block';
}
</script>
<body>
    <div class='container' id='container'>
        <h1>User Profile</h1>
        <img src='profile-picture' alt="user-profile">
        <span>Name: </span><h3 id='name'>Gojo Saturo</h3>
        <hr />
        <span>Email: </span><h3 id='email'>gojo.saturo@example.com</h3>
        <hr />
        <span>Interests: </span><h3 id='interests'>Retail Therapy</h3>
        <hr />
        <button class='button' onclick="updateProfile()" style="vertical-align:middle"> <span>Edit Profile </span></button>
    </div>
    <div class='container' id='container-edit'>
        <h1>User profile</h1>
        <img src='profile-picture' alt="user-profile">
        <span>Name: </span><label for='input-name'></label><input type="text" id='input-name' value='Gojo Saturo' />
        <hr />
        <span>Email: </span><label for='input-email'></label><input type="email" id='input-email' value='gojo.saturo@example.com' />
        <hr />
        <span>Interests: </span><label for='input-interests'></label><input type="text" id='input-interests' value='Retail Therapy' />
        <hr />
        <button class='button' onclick="handleUpdateProfileRequest()">Update Profile</button>
    </div>
</body>
</html>
